configurations.runtimeClasspath {
    // 不固定 Spark 运行库版本：运行时直接使用 $SPARK_HOME/jars，升级 Spark 时无需同步修改这里
    exclude group: 'org.apache.spark'
    exclude group: 'org.scala-lang'
    exclude group: 'org.scala-lang.modules'
    exclude group: 'org.apache.logging.log4j'
    exclude group: 'com.fasterxml.jackson.core'
    exclude group: 'com.fasterxml.jackson.datatype'
    exclude group: 'com.fasterxml.jackson.module'

    [
        'com.google.code.findbugs:jsr305',
        'com.google.code.gson:gson',
        'com.google.guava:guava',
        'com.thoughtworks.paranamer:paranamer',
        'commons-cli:commons-cli',
        'commons-codec:commons-codec',
        'commons-io:commons-io',
        'commons-logging:commons-logging',
        'io.netty:netty-all',
        'io.netty:netty-buffer',
        'io.netty:netty-codec',
        'io.netty:netty-codec-http',
        'io.netty:netty-codec-http2',
        'io.netty:netty-codec-socks',
        'io.netty:netty-common',
        'io.netty:netty-handler',
        'io.netty:netty-handler-proxy',
        'io.netty:netty-resolver',
        'io.netty:netty-transport',
        'io.netty:netty-transport-classes-epoll',
        'io.netty:netty-transport-classes-kqueue',
        'io.netty:netty-transport-native-epoll',
        'io.netty:netty-transport-native-kqueue',
        'io.netty:netty-transport-native-unix-common',
        'org.apache.commons:commons-compress',
        'org.apache.commons:commons-lang3',
        'org.apache.commons:commons-text',
        'org.apache.yetus:audience-annotations',
        'org.objenesis:objenesis',
        'org.slf4j:slf4j-api',
        'org.yaml:snakeyaml'
    ].each { notation ->
        def (String group, String module) = notation.split(':', 2)
        exclude group: group, module: module
    }
}

dependencies {
    api project(':base:dag')
    api group: 'org.apache.spark', name: 'spark-core_' + scalaVersion, version: sparkVersion
    api group: 'org.apache.spark', name: 'spark-sql_' + scalaVersion, version: sparkVersion
    api group: 'org.apache.spark', name: 'spark-streaming_' + scalaVersion, version: sparkVersion

    // https://www.mongodb.com/zh-cn/docs/spark-connector/upcoming/release-notes/
    api (group: 'org.mongodb.spark', name: 'mongo-spark-connector_' + scalaVersion, version: '10.7.0') {
        exclude group: 'org.mongodb', module: 'mongodb-driver-sync'
    }
    api group: 'org.mongodb', name: 'mongodb-driver-sync', version: mongodbVersion
    // 8.17.10 / 8.18.x / 8.19.x 的 elasticsearch-spark-30 只发布了 Gradle variant 元数据：
    // apiElements / runtimeElements 的 capability 是 org.elasticsearch.spark.sql.variant:spark30scala212，
    // 不含默认 capability，直接声明会报 "No matching variant"。
    // 另外它声明的运行期伴随构件（elasticsearch-hadoop-mr -> org.elasticsearch:thirdparty 与
    // elasticsearch-spark_2.12）没有发布到 Maven 中央仓库，这些类本身已经打进该 jar。
    api(group: 'org.elasticsearch', name: 'elasticsearch-spark-30_' + scalaVersion, version: elasticVersion) {
        capabilities {
            requireCapability 'org.elasticsearch.spark.sql.variant:spark30scala212'
        }
        exclude group: 'org.elasticsearch', module: 'elasticsearch-hadoop-mr'
        exclude group: 'org.elasticsearch', module: 'elasticsearch-spark_' + scalaVersion
        // Spark 运行库由 spark-submit / SPARK_HOME 提供，连接器只保留自身实现
        exclude group: 'org.apache.spark'
    }
    api group: 'org.apache.spark', name: 'spark-sql-kafka-0-10_' + scalaVersion, version: sparkVersion
    api group: 'org.apache.spark', name: 'spark-streaming-kafka-0-10_' + scalaVersion, version: sparkVersion

    api group: 'org.postgresql', name: 'postgresql', version: postgresqlVersion
    api group: 'com.clickhouse', name: 'clickhouse-jdbc', version: '0.4.6'
    api group: 'org.neo4j.driver', name: 'neo4j-java-driver', version: neo4jVersion

    implementation group: 'org.apache.poi', name: 'poi-ooxml', version: poiVersion

    testImplementation project(':base:test')
}

test {
    enabled = project.hasProperty('runSparkTests')
    systemProperty 'file.encoding', 'UTF-8'
    jvmArgs(
            '--add-opens=java.base/java.lang=ALL-UNNAMED',
            '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED',
            '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
            '--add-opens=java.base/java.io=ALL-UNNAMED',
            '--add-opens=java.base/java.net=ALL-UNNAMED',
            '--add-opens=java.base/java.nio=ALL-UNNAMED',
            '--add-opens=java.base/java.util=ALL-UNNAMED',
            '--add-opens=java.base/java.util.concurrent=ALL-UNNAMED',
            '--add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED',
            '--add-opens=java.base/jdk.internal.ref=ALL-UNNAMED',
            '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
            '--add-opens=java.base/sun.nio.cs=ALL-UNNAMED',
            '--add-opens=java.base/sun.security.action=ALL-UNNAMED',
            '--add-opens=java.base/sun.util.calendar=ALL-UNNAMED',
            '--add-opens=java.security.jgss/sun.security.krb5=ALL-UNNAMED',
            '-Djdk.reflect.useDirectMethodHandle=false'
    )
}
