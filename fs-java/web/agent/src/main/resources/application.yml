spring:
  application:
    name: fs-agent-service
  profiles:
    active: dev,idev
  jpa:
    show-sql: true
    hibernate:
      naming:
        physical-strategy: com.iisquare.fs.web.agent.dsconfig.NamingStrategy
  servlet:
    multipart:
      # 客户端安装包上传需要更大的容器上限；普通聊天附件仍由 fs.agent.bot.upload.maxSize 限制
      max-file-size: 4096MB
      max-request-size: 4096MB
fs:
  agent:
    # 所有 Agent 相关文件统一落在一个桶中，由语义明确的顶层场景目录区分用途。
    # 桶需预先在 MinIO / S3 中创建。
    storage:
      bucket: fs-agent
    # 模型网关调用超时（毫秒）：向量化 / 重排序等接口慢，读超时给足；
    # 会话补全的读超时是「相邻两次读取」的间隔上限，流式长回复不会被整体耗时掐断
    gateway:
      connectTimeout: 5000        # 向量化 / 重排序等接口的连接超时
      socketTimeout: 300000       # 向量化 / 重排序等接口的读超时（5 分钟）
      requestTimeout: 10000       # 从连接池取连接的等待上限
      chatConnectTimeout: 5000    # 会话补全的连接超时
      chatReadTimeout: 600000     # 会话补全的读超时（10 分钟）
    # 模型对比的兜底上限：模型陷入死循环时输出会一直续下去，读超时拦不住，
    # 越过即主动中断并记为「中断」，保证任何一轮都会收口（0 表示不限制）
    compare:
      maxContentLength: 500000    # 单个模型的输出上限（正文字符数）
      maxDuration: 1800000        # 单个模型的运行时长上限（毫秒，30 分钟）
    # 工具方法调用超时（毫秒）：工具是外部依赖，卡住要尽快失败交给模型重试，不能拖着整轮运行
    tool:
      connectTimeout: 10000
      readTimeout: 60000
    # 工具页「MCP样例」按钮填入的地址：本服务自带的 MCP 服务（SSE 传输，见 spring.ai.mcp.server）
    mcp:
      sampleUrl: http://localhost:7827/sse
      connectTimeout: 10000
      readTimeout: 600000       # MCP 工具调用等待上限（10 分钟，多模态分析需要）
    # 本地客户端（桌面端）上传的文件：统一进入 fs.agent.storage.bucket，按 bot/ 目录区分
    bot:
      upload:
        maxSize: 104857600
      # 桌面端安装包：与普通聊天附件分开配置；Electron 安装包常超过默认 100MB
      version:
        maxSize: 4294967296
    # 多模态工具（MCP 的 multimodalAnalyze）：默认模型名称与单文件字节上限；
    # 调用时给出的 model 参数优先，两者都没有会直接报错提醒配置；
    # timeout 为调用模型网关的读超时（毫秒）
    multimodal:
      maxSize: 20971520
      timeout: 600000
    # 网页搜索 / 网页抓取工具（MCP 的 webSearch / webFetch）：
    # 模型别名取网关里类型为 search / fetch 的模型，服务级密钥需已开通这两个模型；
    # maxContent 为单次抓取返回的正文上限，maxResultContent 为搜索单条正文的上限（字符）
    web:
      maxContent: 30000
      maxResultContent: 8000
