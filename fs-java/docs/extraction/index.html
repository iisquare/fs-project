<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识抽取工作台 · 交互演示</title>
<style>
  :root {
    --primary: #409eff; --primary-light: #ecf5ff; --success: #67c23a; --warning: #e6a23c;
    --danger: #f56c6c; --text: #303133; --regular: #606266; --secondary: #909399;
    --border: #e4e7ed; --light: #ebeef5; --bg: #f5f7fa;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; font-size: 13px; color: var(--text);
    background: var(--bg); font-family: "PingFang SC", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
  }
  .app-bar { flex: none; display: flex; align-items: center; flex-wrap: wrap; gap: 16px; padding: 12px 18px; background: #fff; border-bottom: 1px solid var(--light); }
  .app-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }
  .app-title::before { content: ''; width: 3px; height: 16px; border-radius: 2px; background: var(--primary); }
  .tag-demo { padding: 1px 6px; font-size: 11px; font-weight: 400; color: var(--primary); background: var(--primary-light); border-radius: 10px; }
  .app-config { display: flex; align-items: center; flex-wrap: wrap; gap: 16px; margin-left: auto; }
  .app-config label { display: flex; align-items: center; gap: 6px; color: var(--regular); }
  select { height: 28px; padding: 0 6px; font: inherit; color: var(--text); background: #fff; border: 1px solid var(--border); border-radius: 4px; }
  input[type="range"] { width: 110px; accent-color: var(--primary); }
  .btn { height: 28px; padding: 0 14px; font-size: 13px; color: var(--regular); background: #fff; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; transition: all .2s; }
  .btn:hover { color: var(--primary); border-color: var(--primary); }
  .btn.primary { color: #fff; background: var(--primary); border-color: var(--primary); }
  .btn.success { color: #fff; background: var(--success); border-color: var(--success); }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
  .layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 230px minmax(340px, 1fr) 400px; gap: 12px; padding: 12px; }
  .panel { display: flex; flex-direction: column; min-height: 0; background: #fff; border: 1px solid var(--light); border-radius: 8px; overflow: hidden; }
  .panel-head { flex: none; display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 14px; font-weight: 600; border-bottom: 1px solid var(--light); }
  .panel-head .hint, .panel-head .count { font-weight: 400; font-size: 12px; color: var(--secondary); }
  .panel-body { flex: 1; min-height: 0; overflow: auto; }
  .source-item { display: flex; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--light); cursor: pointer; }
  .source-item:hover { background: var(--bg); }
  .source-item.active { background: var(--primary-light); box-shadow: inset 3px 0 0 var(--primary); }
  .source-item .icon { flex: none; width: 20px; height: 20px; display: grid; place-items: center; font-size: 11px; color: #fff; background: var(--primary); border-radius: 4px; }
  .source-item .icon.table { background: var(--success); }
  .source-item .icon.api { background: var(--warning); }
  .source-item .meta { margin-top: 2px; font-size: 11px; color: var(--secondary); }
  .doc-body { padding: 16px 18px; font-size: 14px; line-height: 2.1; color: #2c3e50; }
  .doc-body .ent { padding: 1px 3px; border-radius: 3px; border-bottom: 2px solid currentColor; cursor: pointer; transition: background-color .2s; }
  .doc-body .ent.hover { background: rgba(64, 158, 255, .18); }
  .doc-body .ent.ignored { color: #b6bcc6 !important; border-bottom-color: transparent; text-decoration: line-through; }
  .doc-body .ent .badge { margin-left: 2px; font-size: 10px; vertical-align: super; opacity: .85; }
  .doc-legend { flex: none; display: flex; flex-wrap: wrap; gap: 12px; padding: 8px 18px 12px; font-size: 12px; color: var(--secondary); border-top: 1px dashed var(--light); }
  .doc-legend i { display: inline-block; width: 8px; height: 8px; margin-right: 4px; border-radius: 50%; }
  .progress-mask { display: none; align-items: center; gap: 10px; margin: 12px 18px 0; padding: 8px 12px; font-size: 12px; color: var(--primary); background: var(--primary-light); border-radius: 6px; }
  .progress-mask.show { display: flex; }
  .progress-bar { flex: 1; height: 4px; background: rgba(64, 158, 255, .2); border-radius: 2px; overflow: hidden; }
  .progress-bar span { display: block; width: 0; height: 100%; background: var(--primary); transition: width .3s; }
  .tabs { display: flex; gap: 4px; }
  .tab { padding: 4px 10px; font-weight: 400; border-radius: 4px; cursor: pointer; }
  .tab.active { font-weight: 600; color: var(--primary); background: var(--primary-light); }
  .result-item { margin: 10px 12px; padding: 10px 12px; border: 1px solid var(--light); border-radius: 6px; transition: border-color .2s, box-shadow .2s; }
  .result-item:hover { border-color: var(--primary); box-shadow: 0 2px 8px rgba(64, 158, 255, .12); }
  .result-item.highlight { border-color: var(--primary); background: var(--primary-light); }
  .result-item.ignored { opacity: .55; }
  .result-item .row1 { display: flex; align-items: center; gap: 8px; }
  .result-item .label { font-size: 13px; font-weight: 600; }
  .result-item .row2 { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; color: var(--secondary); }
  .result-item textarea { width: 100%; margin-top: 6px; padding: 6px 8px; font: inherit; color: var(--regular); border: 1px solid var(--light); border-radius: 4px; resize: vertical; }
  .chip { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; font-size: 11px; border: 1px solid transparent; border-radius: 10px; }
  .chip.solid { color: #fff; }
  .chip.plain { color: var(--regular); background: var(--bg); border-color: var(--light); }
  .conf { margin-left: auto; font-size: 12px; }
  .conf.high { color: var(--success); }
  .conf.mid { color: var(--warning); }
  .conf.low { color: var(--danger); }
  .switch { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; font-size: 12px; cursor: pointer; }
  .switch input { accent-color: var(--primary); }
  .key-input { width: 96px; height: 24px; padding: 0 6px; font: inherit; border: 1px solid var(--light); border-radius: 4px; }
  .empty { padding: 40px 0; font-size: 12px; color: var(--secondary); text-align: center; }
  .action-bar { flex: none; display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: #fff; border-top: 1px solid var(--light); }
  .stat { display: flex; align-items: center; gap: 12px; color: var(--regular); }
  .stat b { color: var(--primary); }
  .spacer { flex: 1; }
  .toast-wrap { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 99; }
  .toast { min-width: 260px; padding: 10px 14px; background: #fff; border: 1px solid var(--light); border-left: 3px solid var(--success); border-radius: 6px; box-shadow: 0 6px 18px rgba(0, 0, 0, .1); animation: slideIn .25s ease; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  @media (max-width: 1280px) {
    .layout { grid-template-columns: 1fr; grid-auto-rows: minmax(240px, auto); overflow: auto; }
  }
</style>
</head>
<body>
  <header class="app-bar">
    <div class="app-title">知识抽取工作台<span class="tag-demo">交互演示</span></div>
    <div class="app-config">
      <label>本体
        <select id="ontology">
          <option>企业关系本体</option>
          <option>产业链本体</option>
        </select>
      </label>
      <label>抽取方式
        <select id="mode">
          <option value="rule">规则 + 词典</option>
          <option value="llm">大模型抽取</option>
        </select>
      </label>
      <label>置信度阈值
        <input type="range" id="threshold" min="0.5" max="0.95" step="0.01" value="0.7">
        <span id="thresholdText">0.70</span>
      </label>
      <button class="btn primary" id="runBtn">开始抽取</button>
    </div>
  </header>

  <main class="layout">
    <aside class="panel">
      <div class="panel-head">数据源<span class="count" id="sourceCount"></span></div>
      <div class="panel-body" id="sourceList"></div>
    </aside>

    <section class="panel">
      <div class="panel-head">原文<span class="hint">点击高亮可定位右侧结果，未采纳的置灰</span></div>
      <div class="panel-body">
        <div class="progress-mask" id="progress">
          <span id="progressText">正在抽取…</span>
          <div class="progress-bar"><span id="progressBar"></span></div>
        </div>
        <div class="doc-body" id="docBody"></div>
      </div>
      <div class="doc-legend" id="docLegend"></div>
    </section>

    <aside class="panel">
      <div class="panel-head">
        <div class="tabs" id="tabs"></div>
        <span class="count" id="resultCount"></span>
      </div>
      <div class="panel-body" id="resultBody"></div>
    </aside>
  </main>

  <footer class="action-bar">
    <div class="stat" id="stat"></div>
    <div class="spacer"></div>
    <span class="hint">按主键 MERGE 入图，重复数据自动合并</span>
    <button class="btn" id="resetBtn">重置</button>
    <button class="btn success" id="saveBtn" disabled>入图</button>
  </footer>

  <div class="toast-wrap" id="toastWrap"></div>

<script>
/* ---------------- 演示数据 ---------------- */
const PALETTE = { Company: '#409eff', Person: '#9b59b6', Product: '#16a085', Location: '#e6a23c' };
const LABEL_NAME = { Company: '企业', Person: '人员', Product: '产品', Location: '地点' };

const SOURCES = [
  { id: 'doc-1', type: 'text', title: '星辰科技企业公告', meta: '文本 · 218 字', active: true },
  { id: 'doc-2', type: 'table', title: '供应商名录.xlsx', meta: '表格 · 42 行', active: false },
  { id: 'doc-3', type: 'api', title: '企业信息接口', meta: '接口 · 按名称查询', active: false }
];

const DOC_TEXT = '星辰科技股份有限公司成立于2008年，注册资本5000万元，主营业务为新能源电池管理系统。公司董事长李明同时担任智联云数据科技有限公司的董事。2023年，星辰科技与华芯半导体签署战略合作协议，由华芯半导体供应车规级芯片，采购金额1.2亿元。公司研发中心位于苏州市工业园区，现有员工860人。';

const ENTITIES = [
  { id: 'e1', text: '星辰科技股份有限公司', label: 'Company', code: 'CX001', confidence: 0.96, accepted: true },
  { id: 'e2', text: '新能源电池管理系统', label: 'Product', code: 'PR001', confidence: 0.88, accepted: true },
  { id: 'e3', text: '李明', label: 'Person', code: 'PS001', confidence: 0.94, accepted: true },
  { id: 'e4', text: '智联云数据科技有限公司', label: 'Company', code: 'CX002', confidence: 0.92, accepted: true },
  { id: 'e5', text: '华芯半导体', label: 'Company', code: 'CX003', confidence: 0.68, accepted: false },
  { id: 'e6', text: '苏州市工业园区', label: 'Location', code: 'LC001', confidence: 0.83, accepted: true }
];

const RELATIONS = [
  { id: 'r1', source: 'e1', target: 'e3', type: 'WORKS_FOR', name: '董事长', confidence: 0.9, accepted: true, evidence: '公司董事长李明' },
  { id: 'r2', source: 'e3', target: 'e4', type: 'DIRECTOR_OF', name: '担任董事', confidence: 0.86, accepted: true, evidence: '同时担任智联云数据科技有限公司的董事' },
  { id: 'r3', source: 'e1', target: 'e2', type: 'PRODUCES', name: '主营产品', confidence: 0.91, accepted: true, evidence: '主营业务为新能源电池管理系统' },
  { id: 'r4', source: 'e4', target: 'e5', type: 'SUPPLIES', name: '供应芯片', confidence: 0.64, accepted: false, evidence: '由华芯半导体供应车规级芯片' },
  { id: 'r5', source: 'e1', target: 'e6', type: 'LOCATED_IN', name: '位于', confidence: 0.82, accepted: true, evidence: '研发中心位于苏州市工业园区' }
];

const ATTRIBUTES = [
  { id: 'a1', entity: 'e1', field: '成立时间', value: '2008-01', confidence: 0.95, accepted: true },
  { id: 'a2', entity: 'e1', field: '注册资本', value: '5000 万元', confidence: 0.93, accepted: true },
  { id: 'a3', entity: 'e1', field: '员工人数', value: '860', confidence: 0.88, accepted: true },
  { id: 'a4', entity: 'e1', field: '采购金额', value: '1.2 亿元', confidence: 0.7, accepted: true }
];

const state = { tab: 'entity', selected: null, extracted: false, timer: null, entities: [], relations: [], attributes: [] };
/* ---------------- 工具 ---------------- */
const $ = (id) => document.getElementById(id);
const clone = (list) => list.map((item) => Object.assign({}, item));
const entityOf = (id) => state.entities.find((item) => item.id === id);
const confClass = (value) => value >= 0.85 ? 'high' : (value >= 0.7 ? 'mid' : 'low');
const confText = (value) => (value * 100).toFixed(0) + '%';
const escapeHtml = (text) => String(text).replace(/[&<>"']/g, (char) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));

function toast(message) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = message;
  $('toastWrap').appendChild(el);
  setTimeout(() => el.remove(), 2800);
}

/* ---------------- 数据源 ---------------- */
function renderSources() {
  $('sourceList').innerHTML = SOURCES.map((item) => `
    <div class="source-item ${item.active ? 'active' : ''}" data-id="${item.id}">
      <span class="icon ${item.type}">${item.type === 'text' ? '文' : (item.type === 'table' ? '表' : '接')}</span>
      <span>
        <div class="name">${item.title}</div>
        <div class="meta">${item.meta}</div>
      </span>
    </div>`).join('');
  $('sourceCount').textContent = SOURCES.length + ' 个';
  $('sourceList').querySelectorAll('.source-item').forEach((node) => {
    node.onclick = () => {
      if (node.dataset.id !== 'doc-1') return toast('演示只包含第一个文本数据源');
      SOURCES.forEach((item) => { item.active = item.id === node.dataset.id; });
      renderSources();
    };
  });
}

/* ---------------- 原文高亮 ---------------- */
function positionEntities() {
  let cursor = 0;
  state.entities.forEach((entity) => {
    const index = DOC_TEXT.indexOf(entity.text, cursor);
    entity.start = index;
    entity.end = index + entity.text.length;
    cursor = entity.end;
  });
}

function renderDocument() {
  if (!state.extracted) {
    $('docBody').innerHTML = '<span style="color:#909399">点击右上角「开始抽取」，从原文中识别实体、关系与属性。</span>';
    $('docLegend').innerHTML = '';
    return;
  }
  const parts = [];
  let cursor = 0;
  state.entities.slice().sort((a, b) => a.start - b.start).forEach((entity) => {
    if (entity.start < cursor) return;
    parts.push(escapeHtml(DOC_TEXT.slice(cursor, entity.start)));
    const ignored = entity.accepted ? '' : ' ignored';
    const hover = state.selected === entity.id ? ' hover' : '';
    parts.push(`<span class="ent${ignored}${hover}" data-id="${entity.id}" style="color:${PALETTE[entity.label]}"
      title="${LABEL_NAME[entity.label]} · 置信度 ${confText(entity.confidence)}">${escapeHtml(entity.text)}<span class="badge">${LABEL_NAME[entity.label]}</span></span>`);
    cursor = entity.end;
  });
  parts.push(escapeHtml(DOC_TEXT.slice(cursor)));
  $('docBody').innerHTML = parts.join('');
  $('docLegend').innerHTML = Object.keys(PALETTE)
    .map((label) => `<span><i style="background:${PALETTE[label]}"></i>${LABEL_NAME[label]}</span>`).join('')
    + '<span style="margin-left:auto">删除线表示未采纳</span>';
  $('docBody').querySelectorAll('.ent').forEach((node) => {
    node.onclick = () => {
      state.selected = node.dataset.id;
      state.tab = 'entity';
      render();
      const card = document.querySelector(`#resultBody .result-item[data-id="${state.selected}"]`);
      if (card) card.scrollIntoView({ block: 'center', behavior: 'smooth' });
    };
  });
}

/* ---------------- 结果面板 ---------------- */
function renderTabs() {
  const counts = { entity: state.entities.length, relation: state.relations.length, attribute: state.attributes.length };
  $('tabs').innerHTML = [['entity', '实体'], ['relation', '关系'], ['attribute', '属性']]
    .map(([key, name]) => `<div class="tab ${state.tab === key ? 'active' : ''}" data-key="${key}">${name} ${counts[key]}</div>`)
    .join('');
  $('tabs').querySelectorAll('.tab').forEach((node) => {
    node.onclick = () => { state.tab = node.dataset.key; render(); };
  });
}

function entityCard(entity) {
  const cls = [entity.accepted ? '' : 'ignored', state.selected === entity.id ? 'highlight' : ''].join(' ');
  return `
    <div class="result-item ${cls}" data-id="${entity.id}">
      <div class="row1">
        <span class="chip solid" style="background:${PALETTE[entity.label]}">${LABEL_NAME[entity.label]}</span>
        <span class="label">${escapeHtml(entity.text)}</span>
        <span class="conf ${confClass(entity.confidence)}">${confText(entity.confidence)}</span>
      </div>
      <div class="row2">
        <span>主键</span>
        <input class="key-input" data-key-input="${entity.id}" value="${escapeHtml(entity.code)}">
        <label class="switch"><input type="checkbox" data-accept="${entity.id}" ${entity.accepted ? 'checked' : ''}>采纳</label>
      </div>
    </div>`;
}

function relationCard(relation) {
  const source = entityOf(relation.source);
  const target = entityOf(relation.target);
  const cls = [relation.accepted ? '' : 'ignored', state.selected === relation.id ? 'highlight' : ''].join(' ');
  return `
    <div class="result-item ${cls}" data-id="${relation.id}">
      <div class="row1">
        <span class="label">${source ? escapeHtml(source.text) : '?'} → ${target ? escapeHtml(target.text) : '?'}</span>
        <span class="conf ${confClass(relation.confidence)}">${confText(relation.confidence)}</span>
      </div>
      <div class="row2">
        <span class="chip plain">${escapeHtml(relation.name)}</span>
        <span>${relation.type}</span>
        <label class="switch"><input type="checkbox" data-accept="${relation.id}" ${relation.accepted ? 'checked' : ''}>采纳</label>
      </div>
      <textarea rows="1" readonly>证据：${escapeHtml(relation.evidence)}</textarea>
    </div>`;
}

function attributeCard(attribute) {
  const entity = entityOf(attribute.entity);
  const cls = [attribute.accepted ? '' : 'ignored', state.selected === attribute.id ? 'highlight' : ''].join(' ');
  return `
    <div class="result-item ${cls}" data-id="${attribute.id}">
      <div class="row1">
        <span class="label">${entity ? escapeHtml(entity.text) : '?'} · ${escapeHtml(attribute.field)}</span>
        <span class="conf ${confClass(attribute.confidence)}">${confText(attribute.confidence)}</span>
      </div>
      <div class="row2">
        <span class="chip plain">${escapeHtml(attribute.value)}</span>
        <label class="switch"><input type="checkbox" data-accept="${attribute.id}" ${attribute.accepted ? 'checked' : ''}>采纳</label>
      </div>
    </div>`;
}

function renderResults() {
  if (!state.extracted) {
    $('resultBody').innerHTML = '<div class="empty">尚未抽取，点击右上角「开始抽取」</div>';
    $('resultCount').textContent = '';
    return;
  }
  const list = state.tab === 'entity' ? state.entities : (state.tab === 'relation' ? state.relations : state.attributes);
  $('resultBody').innerHTML = list.map((item) => state.tab === 'entity' ? entityCard(item)
    : (state.tab === 'relation' ? relationCard(item) : attributeCard(item))).join('')
    || '<div class="empty">没有抽取结果</div>';
  $('resultBody').querySelectorAll('[data-accept]').forEach((node) => {
    node.onchange = () => {
      const target = list.find((item) => item.id === node.dataset.accept);
      if (!target) return;
      target.accepted = node.checked;
      render();
    };
  });
  $('resultBody').querySelectorAll('.key-input').forEach((node) => {
    node.onchange = () => {
      const target = entityOf(node.dataset.keyInput);
      if (target) target.code = node.value;
    };
  });
  $('resultBody').querySelectorAll('.result-item').forEach((node) => {
    node.onmouseenter = () => { state.selected = node.dataset.id; highlightInDoc(); };
    node.onmouseleave = () => { state.selected = null; highlightInDoc(); };
  });
  $('resultCount').textContent = '阈值 ' + Number($('threshold').value).toFixed(2) + ' 以下默认不采纳';
}

function highlightInDoc() {
  document.querySelectorAll('#docBody .ent').forEach((node) => {
    node.classList.toggle('hover', node.dataset.id === state.selected);
  });
  document.querySelectorAll('#resultBody .result-item').forEach((node) => {
    node.classList.toggle('highlight', node.dataset.id === state.selected);
  });
}

function renderStats() {
  if (!state.extracted) {
    $('stat').innerHTML = '<span>等待抽取</span>';
    $('saveBtn').disabled = true;
    return;
  }
  const accepted = (list) => list.filter((item) => item.accepted).length;
  const pending = (state.entities.length - accepted(state.entities)) + (state.relations.length - accepted(state.relations));
  $('stat').innerHTML = `
    <span>实体 <b>${accepted(state.entities)}</b>/${state.entities.length}</span>
    <span>关系 <b>${accepted(state.relations)}</b>/${state.relations.length}</span>
    <span>属性 <b>${accepted(state.attributes)}</b>/${state.attributes.length}</span>
    <span style="color:var(--warning)">待确认 ${pending}</span>`;
  $('saveBtn').disabled = accepted(state.entities) === 0;
}

function render() {
  renderTabs();
  renderDocument();
  renderResults();
  renderStats();
}

/* ---------------- 抽取流程 ---------------- */
function applyMode(mode) {
  const threshold = Number($('threshold').value);
  state.entities = clone(ENTITIES);
  state.relations = clone(RELATIONS);
  state.attributes = clone(ATTRIBUTES);
  // 演示差异：大模型召回更高（置信度略升），规则方式更保守
  state.entities.forEach((item) => {
    if (mode === 'llm') item.confidence = Math.min(0.99, item.confidence + 0.04);
    item.accepted = item.confidence >= threshold;
  });
  state.relations.forEach((item) => {
    if (mode === 'llm') item.confidence = Math.min(0.99, item.confidence + 0.05);
    item.accepted = item.confidence >= threshold;
  });
  state.attributes.forEach((item) => { item.accepted = item.confidence >= threshold; });
  positionEntities();
}

function runExtraction() {
  if (state.timer) return;
  const mode = $('mode').value;
  state.extracted = false;
  render();
  const steps = mode === 'llm'
    ? ['大模型理解文本…', '抽取实体…', '抽取关系与属性…', '结果对齐本体…']
    : ['词典匹配实体…', '正则抽取属性…', '规则匹配关系…', '结果对齐本体…'];
  let index = 0;
  $('progress').classList.add('show');
  const tick = () => {
    $('progressText').textContent = steps[index];
    $('progressBar').style.width = ((index + 1) / steps.length * 100) + '%';
    index += 1;
    if (index < steps.length) {
      state.timer = setTimeout(tick, 420);
      return;
    }
    state.timer = setTimeout(() => {
      $('progress').classList.remove('show');
      $('progressBar').style.width = '0';
      state.timer = null;
      applyMode(mode);
      state.extracted = true;
      render();
      toast(mode === 'llm' ? '大模型抽取完成，请逐条确认' : '规则抽取完成，低置信结果默认未采纳');
    }, 320);
  };
  tick();
}

/* ---------------- 事件 ---------------- */
$('runBtn').onclick = runExtraction;
$('threshold').oninput = () => {
  $('thresholdText').textContent = Number($('threshold').value).toFixed(2);
  if (!state.extracted) return;
  applyMode($('mode').value);
  render();
};
$('resetBtn').onclick = () => {
  state.extracted = false;
  state.selected = null;
  state.entities = [];
  state.relations = [];
  state.attributes = [];
  render();
};
$('saveBtn').onclick = () => {
  const entities = state.entities.filter((item) => item.accepted);
  const relations = state.relations.filter((item) => item.accepted);
  const attributes = state.attributes.filter((item) => item.accepted);
  toast(`已入图：实体 ${entities.length} 个、关系 ${relations.length} 条、属性 ${attributes.length} 项（按主键 MERGE，重复自动合并）`);
};

/* ---------------- 初始化 ---------------- */
state.entities = clone(ENTITIES);
state.relations = clone(RELATIONS);
state.attributes = clone(ATTRIBUTES);
positionEntities();
$('thresholdText').textContent = Number($('threshold').value).toFixed(2);
renderSources();
render();
</script>
</body>
</html>
